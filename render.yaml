services:
  - type: web
    name: roscopal
    env: docker
    plan: free
    branch: main
    dockerfilePath: Dockerfile
    healthCheckPath: /api/health
    disk:
      name: roscopal-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /app/data
      - key: DATABASE_PATH
        value: /app/data/roscopal.sqlite
      - key: PAYPAL_MODE
        value: LIVE_SANDBOX
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
